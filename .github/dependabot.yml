version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directories:
      - /.plain-agent/sandbox
      - /sandbox/examples/minimal
      - /sandbox/examples/nodejs-monorepo
      - /sandbox-templates/dind-egress-proxy/gateway
      - /sandbox-templates/dind-egress-proxy/sandbox
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-image:
        patterns:
          - "*"
  - package-ecosystem: docker-compose
    directory: /sandbox-templates/dind-egress-proxy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-image:
        patterns:
          - "*"
