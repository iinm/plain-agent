name: Sandbox Test

on:
  pull_request:
    paths:
      - "sandbox/**"
  push:
    branches: [main]
    paths:
      - "sandbox/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y fd-find
          ln -s $(which fdfind) /usr/local/bin/fd

          bash sandbox/test.sh
